<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-label="The Quiet Atlas promotional reel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17222c"/>
      <stop offset="0.55" stop-color="#0d1318"/>
      <stop offset="1" stop-color="#090e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#b99a62" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b99a62" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <rect width="360" height="640" fill="url(#glow)"/>
  <rect x="150" y="190" width="60" height="60" fill="none" stroke="#b99a62" stroke-width="1.5"/>
  <text x="180" y="233" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="38" fill="#d8c18c">Q</text>
  <text x="180" y="300" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="4" fill="#f4efe6">THE QUIET <tspan fill="#d8c18c">ATLAS</tspan></text>
  <line x1="150" y1="322" x2="210" y2="322" stroke="#b99a62" stroke-opacity="0.5"/>
  <text x="180" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#f4efe6" fill-opacity="0.85">Some places are best</text>
  <text x="180" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#f4efe6" fill-opacity="0.85">discovered slowly.</text>
</svg>
